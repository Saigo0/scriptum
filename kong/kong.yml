_format_version: "3.0"
services:
  - name: scriptum-ocr
    url: http://ocr:8080
    routes:
      - name: ocr-route
        paths:
          - /ocr
        strip_path: false
    plugins:
      - name: key-auth

  - name: scriptum-note-manager
    url: http://note-manager:8081
    routes:
      - name: documentos-route
        paths:
          - /documentos
        strip_path: false
      - name: grupos-route
        paths:
          - /grupos
        strip_path: false
    plugins:
      - name: key-auth

consumers:
  - username: scriptum-client
    keyauth_credentials:
      - key: scriptum-dev-key

