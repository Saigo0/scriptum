quarkus.http.port=8081

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/notes
quarkus.hibernate-orm.database.generation=update

mp.messaging.outgoing.ocr-processing.connector=smallrye-rabbitmq
mp.messaging.outgoing.ocr-processing.exchange.name=ocr.processing
mp.messaging.outgoing.ocr-processing.exchange.type=direct
mp.messaging.outgoing.ocr-processing.exchange.declare=true
mp.messaging.outgoing.ocr-processing.default-routing-key=ocr.processing
mp.messaging.outgoing.ocr-processing.host=${RABBITMQ_HOST:localhost}
mp.messaging.outgoing.ocr-processing.port=${RABBITMQ_PORT:5672}
mp.messaging.outgoing.ocr-processing.username=${RABBITMQ_USERNAME:admin}
mp.messaging.outgoing.ocr-processing.password=${RABBITMQ_PASSWORD:admin}

mp.messaging.incoming.ocr-reading-return.connector=smallrye-rabbitmq
mp.messaging.incoming.ocr-reading-return.queue.name=ocr-reading-return
mp.messaging.incoming.ocr-reading-return.exchange.name=ocr.reading
mp.messaging.incoming.ocr-reading-return.exchange.type=direct
mp.messaging.incoming.ocr-reading-return.exchange.declare=true
mp.messaging.incoming.ocr-reading-return.queue.declare=true
mp.messaging.incoming.ocr-reading-return.host=${RABBITMQ_HOST:localhost}
mp.messaging.incoming.ocr-reading-return.port=${RABBITMQ_PORT:5672}
mp.messaging.incoming.ocr-reading-return.username=${RABBITMQ_USERNAME:admin}
mp.messaging.incoming.ocr-reading-return.password=${RABBITMQ_PASSWORD:admin}

%test.mp.messaging.outgoing.ocr-processing.connector=smallrye-in-memory
%test.mp.messaging.incoming.ocr-reading-return.connector=smallrye-in-memory
